# Déploiement complet : base de données, API et frontend (Caddy).
#
#   cp .env.example .env        # puis remplir les secrets
#   docker compose up -d --build
#   docker compose run --rm api jacquard pack sync /pack
#   docker compose run --rm api jacquard admin create <pseudo>

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jacquard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      POSTGRES_DB: jacquard
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jacquard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      JACQUARD_DATABASE_URL: postgresql+psycopg://jacquard:${POSTGRES_PASSWORD}@db:5432/jacquard
      JACQUARD_SECRET_KEY: ${JACQUARD_SECRET_KEY:?à définir dans .env}
      JACQUARD_REGISTRATION_CODE: ${JACQUARD_REGISTRATION_CODE:-}
      JACQUARD_COOKIE_SECURE: ${JACQUARD_COOKIE_SECURE:-true}
    volumes:
      - api-data:/data
      # Le pack de l'événement (repo privé), en lecture seule.
      - ${JACQUARD_PACK_DIR:-./examples/demo-pack}:/pack:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      JACQUARD_DOMAIN: ${JACQUARD_DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data

volumes:
  db-data:
  api-data:
  caddy-data:
